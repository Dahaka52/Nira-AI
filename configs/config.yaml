# =============================================================================
# КОНФИГУРАЦИЯ НИРА
# =============================================================================

# -----------------------------------------------------------------------------
# 1. АКТИВНЫЕ ОПЕРАЦИИ И СЦЕНЫ (быстрое переключение)
# -----------------------------------------------------------------------------
# [Multi-user] Сцены и Мультиплеер
active_scene: "local"               # "local" (только Создатель) или "discord" (Многопользовательский режим)
known_users:
  "mic": "Вова"
  "default": "Незнакомец"
  # "discord_user_id": "Alex"

# [Barge-in Rework] Буферизация и фильтрация STT
stt_buffer_timeout_ms: 1400         # Ждать 1400мс тишины перед отправкой реплики в LLM (защита от перебивания на паузах)
stt_filter_mode: "algorithm"        # "algorithm" или "llm" (если "llm", потребуется модуль stt_summarizer)
stt_stop_words: ["стоп", "подожди", "хватит", "замолчи", "тихо", "молчи", "выключи", "помолчи", "остановись", "стой"]
stt_listen_triggers: ["послушай", "послушай меня", "дай я расскажу", "хочу рассказать", "сейчас расскажу", "слушай"]
stt_release_triggers: ["что думаешь", "как тебе", "что скажешь", "отвечай", "твое мнение", "я все", "я всё", "все", "всё", "конец", "готово"]
stt_listening_timeout_s: 15          # Сбрасывать режим слушателя в обычный диалог через 15 сек тишины

stt_active_id: "gigaam_ru"   # Выбери id из секции operations.stt
stt_strict_active_id: true          # Падать при старте если id не найден
t2t_active_id: "llamacpp"        # Выбери id из секции operations.t2t
t2t_strict_active_id: true          # Падать при старте если id не найден

# -----------------------------------------------------------------------------
# 2. ГЛОБАЛЬНЫЕ ПАРАМЕТРЫ ГЕНЕРАЦИИ ТЕКСТА (применяются ко всем T2T модулям)
# -----------------------------------------------------------------------------
t2t:
  max_length: 400                    # Достаточный объем для историй, эмоциональной речи и развернутых мыслей
  temperature: 0.7
  top_p: 0.95
  top_k: 40
  stream: true

# Служебные WS-события raw prompt/history (true = много трафика, только для отладки)
broadcast_debug_prompt_events: false

# -----------------------------------------------------------------------------
# 3. МОДУЛИ (OPERATIONS)
# -----------------------------------------------------------------------------
operations:

  # --- STT: Speech-to-Text ---------------------------------------------------

  # GigaAM-v3 (NeMo CTC) — сверхбыстрый (<50мс) офлайн STT для русского языка от Сбера (рекомендуется)
  - role: stt
    id: gigaam_ru
    entrypoint: "utils.operations.stt.gigaam:GigaAMSTT"
    model_path: "C:\\Nirmita\\models\\gigaam\\gigaam_v3_e2e_ctc_int8.onnx"
    tokens_path: "C:\\Nirmita\\models\\gigaam\\gigaam_v3_e2e_ctc_tokens.txt"
    num_threads: 4               # Потоки CPU для инференса (4-6 оптимально для 5700X3D)
    provider: "cpu"
    sample_rate: 16000
    feature_dim: 64
    decoding_method: "greedy_search"
    blank_penalty: 0.0           # Штраф бланков CTC (0.0 по умолчанию; 0.2-0.5 если "съедаются" буквы)
    hotwords_file: "C:\\Nirmita\\models\\hotwords.txt" # Список приоритетных ключевых слов
    hotwords_score: 2.0          # Вес приоритета горячих слов
    gain_normalization: true     # Авто-нормализация громкости слабого звука / тихого голоса (AGC)
    target_peak: 0.95            # Целевой пиковый уровень амплитуды
    max_gain: 4.0                # Максимальный коэффициент усиления
    alias_map:                   # Словарь исправления омофонов и частых ошибок транскрипции
      "мира": "Нира"
      "миру": "Ниру"
      "миром": "Нирой"
      "мире": "Нире"
      "миры": "Ниры"
    process_autostart: true

  # Faster Whisper — русская транскрипция
  - role: stt
    id: faster_whisper_ru
    entrypoint: "utils.operations.stt.faster_whisper:FasterWhisperSTT"
    model_size: "large-v3-turbo"
    device: "cuda"
    compute_type: "int8_float16"
    language: "ru"
    vad_filter: false
    initial_prompt: "Нира, Вова: постой, стой, подожди, слушай, расскажи, да, нет, привет."
    process_autostart: true

  # Groq API — облачный STT через OpenAI-совместимый эндпоинт
  - role: stt
    id: groq_stt
    entrypoint: "utils.operations.stt.openai_api:OpenAISTT"
    base_url: "https://api.groq.com/openai/v1"
    api_key: ""
    model: "whisper-large-v3-turbo"
    language: "ru"
    process_autostart: true

  # Google Gemini Live — потоковый STT через WebSocket
  - role: stt
    id: google_stt
    entrypoint: "utils.operations.stt.google_live:GoogleLiveSTT"
    api_key: ""
    model: "gemini-3.5-transcribe-live"
    process_autostart: true

  # Sherpa ONNX — резервный потоковый STT (низкая задержка, работает offline)
  - role: stt
    id: sherpa_ru
    entrypoint: "utils.operations.stt.sherpa:SherpaSTT"
    ws_url: "ws://127.0.0.1:6106"
    provider: "cpu"              # cpu | cuda
    language: "ru"
    normalize_output: true
    process_autostart: true
    process_startup_retries: 3
    process_startup_backoff_s: 0.6
    process:
      type: "sherpa_onnx_server"
      preset: "balanced"         # low_latency | balanced | noisy_room
      port: 6106
      provider: "cpu"            # cpu | cuda
      gpu_id: 1                  # RTX 5060 = 1
      model_dir: "C:\\Nirmita\\models\\vosk-model-small-streaming-ru"
      model_variant: "fp32"      # int8 | fp32 | chunk64
      decoding_method: "modified_beam_search"
      num_active_paths: 6
      use_endpoint: 0
      hotwords_file: "C:\\Nirmita\\models\\hotwords.txt"
      hotwords_score: 3.5

  # --- T2T: Text-to-Text -----------------------------------------------------

  # Groq API — ультрабыстрый облачный инференс (активен по умолчанию)
  - role: t2t
    id: groq
    model: "openai/gpt-oss-120b"
    api_key: ""
    base_url: "https://api.groq.com/openai/v1"

  # Google AI Studio — Gemini (резерв или замена Groq)
  - role: t2t
    id: google_ai
    model: "gemini-3.6-flash"
    api_key: ""
    # base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"



  # LlamaCPP — локальная LLM через llama-server (offline, RTX 5070)
  - role: t2t
    id: llamacpp

  # --- TTS: Text-to-Speech ---------------------------------------------------

  # Fish Audio — стриминговый TTS через WebSocket (текущий рабочий модуль)
  - role: tts
    id: fish_audio
    api_key: ""
    reference_id: "8579f19895d8412d9f9e6d515872d455"  # UUID клона голоса
    model: "s2.1-pro-free"       # s1 | s2-pro | s2.1-pro | s2.1-pro-free
    latency: "balanced"          # low | balanced | normal
    sample_rate: 44100
    temperature: 0.7
    top_p: 0.7
    repetition_penalty: 1.2
    chunk_length: 200
    min_chunk_length: 50
    max_new_tokens: 1024
    speed: 1.0
    volume: 0.0

  # --- Фильтры текста --------------------------------------------------------

  # Очистка текста перед TTS (убирает артефакты генерации)
  - role: filter_text
    id: filter_clean

  # --- Фильтры аудио (локальный вывод на стандартное устройство Windows) -----
  - role: filter_audio
    id: speaker
    device_name: null          # null = Стандартное устройство вывода Windows

# -----------------------------------------------------------------------------
# 4. ПУТИ К ИСПОЛНЯЕМЫМ ФАЙЛАМ
# -----------------------------------------------------------------------------

# LlamaCPP (локальный сервер, RTX 5070 12GB)
llamacpp_filepath: "C:\\Nirmita\\bin\\llamacpp\\llama-server.exe"
llamacpp_model_filepath: "C:\\Nirmita\\models\\MN-12B-Hydra-RP-RU.i1-Q4_K_M.gguf"
llamacpp_ctx: 8192
llamacpp_ngl: 40
llamacpp_cache_type_k: "q8_0"   # Квантование K-cache контекста
llamacpp_cache_type_v: "q8_0"   # Квантование V-cache контекста
llamacpp_gpu_id: 0              # RTX 5070 = 0
llamacpp_extra_args: "--flash-attn on"

# FFmpeg (настроен в системе, переопределять только при нестандартной установке)
# ffmpeg_filepath: "C:\\Nirmita\\bin\\ffmpeg.exe"

# -----------------------------------------------------------------------------
# 5. МИКРОФОН И VAD
# -----------------------------------------------------------------------------
microphone:
  enabled: true
  source_id: "mic"
  device_name: "Fifine"          # Основной выбор по имени (устойчив к смене ID)
  device_hostapi: "WASAPI"
  device_index: 7                # Fallback если устройство не найдено по имени

  # VAD (Voice Activity Detection)
  vad_threshold: 0.08
  vad_start_rms: 0.010
  vad_hold_rms: 0.005
  vad_floor_rms: 0.001
  rms_bridge_ms: 96
  min_silence_ms: 500
  min_speech_ms: 200
  pre_roll_ms: 300
  resample_mode: "polyphase"     # Качественный ресемпл 48k→16k

  # AGC (Automatic Gain Control)
  mic_gain_db: 10.0
  agc_enable: true
  agc_target_rms: 0.032
  agc_max_gain_db: 9.0
  soft_limit: 0.97               # Лимитер от клиппинга

  # Слияние и debounce
  voice_merge_window_ms: 2500    # Окно склейки STT-сегментов в один ход
  response_debounce_ms: 500      # Задержка перед запуском RESPONSE
  response_min_quiet_ms_after_speech_start: 350
  turn_merge_window_ms: 2500

  # Barge-in и прерывание
  speech_start_min_interval_ms: 350
  speech_start_confirm_ms: 200
  min_speech_ms_interrupt: 80
  speech_start_interrupt_mode: "soft"  # soft: НЕ затыкать Ниру от шорохов! Прерывать только по стоп-словам или осмысленной фразе!
  interrupt_speaker_policy: "same_or_unknown"  # any | same_only | same_or_unknown

  # Backpressure STT-воркеров
  stt_immediate_max_active: 2
  stt_immediate_max_pending: 16
  stt_backpressure_policy: "drop_oldest"  # drop_oldest | drop_latest | merge_latest
  stt_status_cooldown_ms: 750

  # Wake-words (слова-триггеры, при которых Нира отвечает даже на короткую фразу)
  wake_words: ["нира", "нера", "nira"]
  wake_word_aliases: ["мира", "миру", "миром", "ниру", "нире", "нирой", "ниры", "нерра"]

  # Эмоциональные реакции (смех, хмыканье)
  respond_to_short_emotes: true
  short_emote_words: ["ха-ха", "хаха", "ахах", "ахаха", "хм", "гм", "лол", "ржу"]

# -----------------------------------------------------------------------------
# 6. DISCORD BRIDGE
# -----------------------------------------------------------------------------
discord:
  enabled: true
  auto_join: false
  guild_id: "390301473210236928"
  voice_channel_id: "390301473210236932"
  source_id: "discord"
  api_url: "http://127.0.0.1:7272/api/context/conversation/audio"
  ws_url: "ws://127.0.0.1:7272/"
  silence_ms: 450
  min_speech_ms: 180

# -----------------------------------------------------------------------------
# 7. ПРОМПТЕР И ПЕРСОНАЖ
# -----------------------------------------------------------------------------
prompter:
  instruction_prompt_filename: 'instruction.md'
  character_prompt_filename: 'nira.md'
  scene_prompt_filename: 'scene_local.md'
  character_name: "Нира"
  history_length: 50

# -----------------------------------------------------------------------------
# 8. СИСТЕМНЫЕ НАСТРОЙКИ
# -----------------------------------------------------------------------------

# SpaCy NLP (используется для обработки текста если подключить chunker)
spacy_model: en_core_web_sm
